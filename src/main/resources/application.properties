spring.application.name=gs-hidrobairro
springdoc.info.title=API HidroBairro Sul
springdoc.info.description=API para monitoramento de enchentes, alertas e orientação ao cidadão
springdoc.info.version=v1.0.0
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
spring.datasource.url=jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
jwt.secret=${JWT_SECRET:5Y1TA/kkRuNnAP2myKV5oR7yQ7wyJmdfAQPs6qhZZQU=}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Observabilidade
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
